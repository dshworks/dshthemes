# Nightly: pull the registry, re-read stars and any stale stylesheets, re-shoot
# whatever changed, rebuild, and deploy. Deploy needs CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID as repo secrets; without them the job builds and stops,
# which is still a useful check.
#
# The shots step is what keeps "live" honest: a theme only carries the claim if
# its render came back different from the stock shell, and that has to be
# re-checked whenever its stylesheet changes. The runner's own Chrome is enough
# (playwright-core, channel: chrome), so no browser download.
name: refresh
#
# Also runs on a push to main, because it did not and that was a gap rather
# than a decision: the sibling site (dshworks/plugins) has deployed on push
# since it shipped, so a change landed here by hand sat undeployed for up to
# 24 hours with nothing saying so. A push run only builds and deploys -- the
# steps that read the outside world and commit back to main are gated to the
# scheduled and dispatched runs, so a push cannot start a refresh it did not
# ask for, and the bot's own data commit cannot loop back into another run.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/registry.mjs
        if: github.event_name != 'push'
      - run: node scripts/enrich.mjs
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: node scripts/build.mjs
      - name: shoot what changed
        if: github.event_name != 'push'
        run: node scripts/shots.mjs
      - name: rebuild with the new shots
        if: github.event_name != 'push'
        run: node scripts/build.mjs
      - name: commit data
        if: github.event_name != 'push'
        run: |
          git config user.name "dshthemes-bot"
          git config user.email "dshthemes-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: registry + enrich refresh $(date -u +%F)"
          git push
      # `secrets` is not a valid context in an `if:` -- only in `env:`, `with:`
      # and `run:`. Using it here did not skip the step, it made the whole
      # file unparseable, so from 2026-08-19 this workflow never ran at all:
      # no nightly, no dispatch, and the site silently stopped tracking the
      # registry. The failure showed up as "This run likely failed because of
      # a workflow file issue", which is easy to read as a flake.
      #
      # The gate has to go through env, and be tested in the shell.
      - name: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::no Cloudflare credentials, so the data was refreshed and committed but the site was not deployed"
            echo "set them with:"
            echo "  gh secret set CLOUDFLARE_API_TOKEN --repo dshworks/dshthemes"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID --repo dshworks/dshthemes"
            exit 0
          fi
          npx wrangler deploy
