# Nightly: pull the registry, re-read stars and any stale stylesheets, rebuild,
# and deploy. Deploy needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID as repo
# secrets; without them the job builds and stops, which is still a useful check.
name: refresh
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/registry.mjs
      - run: node scripts/enrich.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm test
      - run: node scripts/build.mjs
      - name: commit data
        run: |
          git config user.name "dshthemes-bot"
          git config user.email "dshthemes-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: registry + enrich refresh $(date -u +%F)"
          git push
      - name: deploy
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
